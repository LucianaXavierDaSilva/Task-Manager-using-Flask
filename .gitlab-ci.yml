stages:
  - build
  - test_unit
  - test_integration
  - test_functional
  - deploy_dev
  - deploy_hml
  - deploy_prod

variables:
  PYTHON_VERSION: "3.11-slim"
  VENV_PATH: ".venv"
  DOCKER_IMAGE_NAME: "task-manager-estudo-caso"
  IMAGE_TAG: "${DOCKER_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
  SECRET_KEY: $SECRET_KEY
  BASE_URL: "http://localhost:8080"

cache:
  key: "venv-${CI_COMMIT_SHORT_SHA}"
  paths:
    - ${VENV_PATH}/

build:
  stage: build
  image: docker:20.10.21
  services:
    - docker:dind
  script:
    - echo "Compilando a imagem Docker..."
    - docker build --tag "$IMAGE_TAG" .
    - echo "Imagem Docker construída com sucesso: $IMAGE_TAG"
  artifacts:
    paths:
      - ./

test_unit:
  stage: test_unit
  image: python:${PYTHON_VERSION}
  script:
    - echo "Executando testes unitários..."
    - python -m venv ${VENV_PATH}
    - source ${VENV_PATH}/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - pytest --cov=todo_project --cov-report=xml:coverage.xml tests/unitary
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test_integration:
  stage: test_integration
  image: docker:20.10.21
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache docker-compose curl python3 py3-pip
  script:
    - echo "Subindo a aplicação com docker-compose..."
    - docker-compose up -d
    - echo "Esperando a aplicação subir..."
    - sleep 10
    - docker ps
    - pip3 install -r requirements.txt
    - pip3 install pytest requests beautifulsoup4 lxml
    - pytest tests/integration
  after_script:
    - echo "Derrubando os containers após testes de integração..."
    - docker-compose down

test_functional:
  stage: test_functional
  image: docker:20.10.21
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache docker-compose curl python3 py3-pip
  script:
    - echo "Subindo a aplicação com docker-compose..."
    - docker-compose up -d
    - echo "Esperando a aplicação subir..."
    - sleep 10
    - docker ps
    - pip3 install -r requirements.txt
    - pip3 install pytest requests
    - pytest tests/functional
  after_script:
    - echo "Derrubando os containers após testes funcionais..."
    - docker-compose down

deploy_dev:
  stage: deploy_dev
  image: alpine/git
  only:
    - develop
  script:
    - echo "Simulando deploy para Desenvolvimento..."
    - echo "Imagem a ser deployada (simulação): $IMAGE_TAG"
    - echo "Nenhuma ação de deploy real implementada neste estudo de caso."

deploy_hml:
  stage: deploy_hml
  image: alpine/git
  only:
    - hml
  script:
    - echo "Simulando deploy para Homologação..."
    - echo "Imagem a ser deployada (simulação): $IMAGE_TAG"
    - echo "Nenhuma ação de deploy real implementada neste estudo de caso."

deploy_prod:
  stage: deploy_prod
  image: alpine/git
  only:
    - main
  script:
    - echo "Simulando deploy para Produção..."
    - echo "Imagem a ser deployada (simulação): $IMAGE_TAG"
    - echo "Nenhuma ação de deploy real implementada neste estudo de caso."

