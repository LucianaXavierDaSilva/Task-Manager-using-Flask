stages:
  - build
  - prepare
  - test
  - sast
  - review
  - deploy_stage
  - dast_zap
  - deploy_dev
  - deploy_hml
  - deploy_prod

build:
  stage: build
  script:
    - echo "Simulando build com sucesso"

prepare:
  stage: prepare
  script:
    - echo "Simulando preparação do ambiente"

test:
  stage: test
  script:
    - echo "Simulando testes unitários"
    - echo "Simulando testes de integração"
    - echo "Simulando testes funcionais"
  parallel:
    matrix:
      - TEST_TYPE: unit
      - TEST_TYPE: integration
      - TEST_TYPE: functional
  script:
    - echo "Simulando testes $TEST_TYPE com sucesso"

sast:
  stage: sast
  parallel:
    matrix:
      - SAST_TOOL: bandit
      - SAST_TOOL: dependency-check
  script:
    - echo "Simulando análise com $SAST_TOOL"

review_app:
  stage: review
  script:
    - echo "Criando ambiente temporário de revisão para o merge request"
  environment:
    name: review/$CI_COMMIT_REF_NAME
    on_stop: stop_review_app
  only:
    - merge_requests

stop_review_app:
  stage: review
  script:
    - echo "Removendo ambiente temporário de revisão"
  environment:
    name: review/$CI_COMMIT_REF_NAME
    action: stop
  when: manual
  only:
    - merge_requests

deploy_stage:
  stage: deploy_stage
  script:
    - echo "Simulando deploy no ambiente de STAGE"
  environment:
    name: staging
    url: http://staging.example.com

dast_zap:
  stage: dast_zap
  script:
    - echo "Simulando análise dinâmica com OWASP ZAP no ambiente de STAGE"
    - echo "ZAP supostamente analisando http://staging.example.com"
  needs:
    - deploy_stage

deploy_dev:
  stage: deploy_dev
  when: manual
  script:
    - echo "Simulando deploy em ambiente DEV"

deploy_hml:
  stage: deploy_hml
  when: manual
  script:
    - echo "Simulando deploy em ambiente HML"

deploy_prod:
  stage: deploy_prod
  when: manual
  script:
    - echo "Simulando deploy em ambiente PROD"
