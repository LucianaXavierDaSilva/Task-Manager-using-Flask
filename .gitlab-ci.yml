stages:
  - build
  - test_unit
  - test_integration
  - test_functional
  - deploy_dev
  - deploy_hml
  - deploy_prod

variables:
  PYTHON_VERSION: "3.11-slim"
  VENV_PATH: ".venv"
  CI_REGISTRY: "192.168.98.10:8080"
  CI_PROJECT_PATH_LOWER: $(echo "$CI_PROJECT_PATH" | tr '[:upper:]' '[:lower:]')
  IMAGE_TAG: "${CI_REGISTRY}/${CI_PROJECT_PATH_LOWER}:${CI_COMMIT_SHORT_SHA}"
  SECRET_KEY: $SECRET_KEY
  BASE_URL: "http://localhost:8080"

cache:
  key: "venv-${CI_COMMIT_SHORT_SHA}"
  paths:
    - ${VENV_PATH}/

build:
  stage: build
  image: docker:20.10.21
  services:
    - docker:dind
  script:
    - echo "Compilando a imagem Docker..."
    - PROJECT_PATH_LOWER=$(echo "$CI_PROJECT_PATH" | tr '[:upper:]' '[:lower:]')
    - IMAGE_TAG_FINAL="${CI_REGISTRY}/${PROJECT_PATH_LOWER}:${CI_COMMIT_SHORT_SHA}"
    - docker build --cache-from "$IMAGE_TAG_FINAL" --tag "$IMAGE_TAG_FINAL" .
    - echo "Pushing a imagem Docker..."
    - docker push "$IMAGE_TAG_FINAL"
  artifacts:
    paths:
      - ./

test_unit:
  stage: test_unit
  image: python:${PYTHON_VERSION}
  script:
    - echo "Executando testes unitários..."
    - python -m venv ${VENV_PATH}
    - source ${VENV_PATH}/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt
    - pip install pytest pytest-cov
    - pytest --cov=todo_project --cov-report=xml:coverage.xml tests/unitary
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test_integration:
  stage: test_integration
  image: python:${PYTHON_VERSION}
  script:
    - echo "Iniciando testes de integração..."
    - python -m venv ${VENV_PATH}
    - source ${VENV_PATH}/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt
    - pip install pytest requests
    - pytest tests/integration

test_functional:
  stage: test_functional
  image: python:${PYTHON_VERSION}
  script:
    - echo "Executando testes funcionais (API)..."
    - python -m venv ${VENV_PATH}
    - source ${VENV_PATH}/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt pytest requests
    - cd tests/functional
    - pytest --base-url=${BASE_URL}

deploy_dev:
  stage: deploy_dev
  image: alpine/git
  only:
    - develop
  script:
    - echo "Deploy para Desenvolvimento..."
    - echo "Simulando deploy da imagem ${IMAGE_TAG} no ambiente de desenvolvimento."
    - echo "Nenhuma ação de deploy real implementada neste estudo de caso."

deploy_hml:
  stage: deploy_hml
  image: alpine/git
  only:
    - hml
  script:
    - echo "Deploy para Homologação..."
    - echo "Simulando deploy da imagem ${IMAGE_TAG} no ambiente de homologação."
    - echo "Nenhuma ação de deploy real implementada neste estudo de caso."

deploy_prod:
  stage: deploy_prod
  image: alpine/git
  only:
    - main
  script:
    - echo "Deploy para Produção..."
    - echo "Simulando deploy da imagem ${IMAGE_TAG} no ambiente de produção."
    - echo "Nenhuma ação de deploy real implementada neste estudo de caso."
