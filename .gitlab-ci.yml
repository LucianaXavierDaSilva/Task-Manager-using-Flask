stages:
  - build
  - prepare
  - test
  - sast
  - review
  - deploy_stage
  - dast
  - deploy_dev
  - deploy_hml
  - deploy_prod

# Build
build:
  stage: build
  script:
    - echo "Simulando build com sucesso"

# Prepare
prepare:
  stage: prepare
  script:
    - echo "Simulando preparação do ambiente"

# Testes (simulados como jobs separados para aparecerem visualmente)
test_unit:
  stage: test
  script:
    - echo "Simulando testes unitários"

test_integration:
  stage: test
  script:
    - echo "Simulando testes de integração"

test_functional:
  stage: test
  script:
    - echo "Simulando testes funcionais"

# SAST (simulados como jobs separados)
sast_bandit:
  stage: sast
  script:
    - echo "Simulando análise estática com Bandit"

sast_dependency_check:
  stage: sast
  script:
    - echo "Simulando análise de dependências com OWASP Dependency-Check"

# Review App (um ambiente temporário para cada merge request)
review_app:
  stage: review
  script:
    - echo "Simulando criação de Review App para este Merge Request"
  only:
    - merge_requests

# Deploy em Stage
deploy_stage:
  stage: deploy_stage
  when: manual
  script:
    - echo "Simulando deploy para ambiente de Stage"

# DAST (OWASP ZAP simulado após o deploy em Stage)
dast_zap:
  stage: dast
  script:
    - echo "Simulando análise dinâmica com OWASP ZAP no ambiente de Stage"
    - echo "Aplicação supostamente acessível em http://stage.example.com"
    - echo "ZAP simulado com sucesso no modo quick scan"

# Deploys manuais
deploy_dev:
  stage: deploy_dev
  when: manual
  script:
    - echo "Simulando deploy em ambiente DEV"

deploy_hml:
  stage: deploy_hml
  when: manual
  script:
    - echo "Simulando deploy em ambiente HML"

deploy_prod:
  stage: deploy_prod
  when: manual
  script:
    - echo "Simulando deploy em ambiente PROD"
