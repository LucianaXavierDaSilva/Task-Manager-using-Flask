stages:
  - build
  - prepare
  - test_unit
  - test_integration
  - test_functional
  - sast_bandit
  - sast_dependency_check
  - review
  - deploy_stage
  - dast_zap
  - deploy_dev
  - deploy_hml
  - deploy_prod

build:
  stage: build
  script:
    - echo "Simulando build com sucesso"

prepare:
  stage: prepare
  script:
    - echo "Simulando preparação do ambiente"

test_unit:
  stage: test_unit
  script:
    - echo "Simulando testes unitários"

test_integration:
  stage: test_integration
  script:
    - echo "Simulando testes de integração"

test_functional:
  stage: test_functional
  script:
    - echo "Simulando testes funcionais"

sast_bandit:
  stage: sast_bandit
  script:
    - echo "Simulando análise estática com Bandit"

sast_dependency_check:
  stage: sast_dependency_check
  script:
    - echo "Simulando análise de dependência com OWASP Dependency-Check"

review_app:
  stage: review
  script:
    - echo "Simulando criação de ambiente de Review App"
  only:
    - merge_requests

deploy_stage:
  stage: deploy_stage
  when: manual
  script:
    - echo "Simulando deploy para ambiente de Stage"

dast_zap:
  stage: dast_zap
  script:
    - echo "Simulando análise dinâmica com OWASP ZAP no ambiente de Stage"
    - echo "Aplicação supostamente acessível em http://stage.example.com"

deploy_dev:
  stage: deploy_dev
  when: manual
  script:
    - echo "Simulando deploy em ambiente DEV"

deploy_hml:
  stage: deploy_hml
  when: manual
  script:
    - echo "Simulando deploy em ambiente HML"

deploy_prod:
  stage: deploy_prod
  when: manual
  script:
    - echo "Simulando deploy em ambiente PROD"
