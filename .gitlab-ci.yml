stages:
  - build
  - test_unit
  - test_integration
  - test_functional
  - sast
  - dast
  - review
  - deploy_dev
  - dast_dev
  - deploy_hml
  - dast_hml
  - monitor
  - deploy_prod

build:
  stage: build
  image: alpine/git
  script:
    - echo "Build Succeeded!"

test_unit:
  stage: test_unit
  image: alpine/git
  script:
    - echo "Unit Tests Passed!"

test_integration:
  stage: test_integration
  image: alpine/git
  script:
    - echo "Integration Tests Passed!"

test_functional:
  stage: test_functional
  image: alpine/git
  script:
    - echo "Functional Tests Passed!"

sast:
  stage: sast
  image: alpine/git
  script:
    - echo "SAST Analysis Completed - No High Severity Issues Found!"

dependency_check:
  stage: sast
  image: alpine/git
  script:
    - echo "Dependency Check Completed - No Vulnerabilities Found!"

dast:
  stage: dast
  image: alpine/git
  script:
    - echo "DAST Analysis Completed - No Vulnerabilities Found!"

review:
  stage: review
  image: alpine/git
  script:
    - echo "Code Review Environment Created!"
  only:
    - merge_requests

deploy_dev:
  stage: deploy_dev
  image: alpine/git
  script:
    - echo "Deployed to Development Successfully!"
  only:
    - develop

dast_dev:
  stage: dast_dev
  image: alpine/git
  script:
    - echo "DAST on Development Completed - No Vulnerabilities Found!"
  dependencies:
    - deploy_dev
  only:
    - develop

deploy_hml:
  stage: deploy_hml
  image: alpine/git
  script:
    - echo "Deployed to Homologation Successfully!"
  only:
    - hml

dast_hml:
  stage: dast_hml
  image: alpine/git
  script:
    - echo "DAST on Homologation Completed - No Vulnerabilities Found!"
  dependencies:
    - deploy_hml
  only:
    - hml

monitor:
  stage: monitor
  image: alpine/git
  script:
    - echo "Monitoring Tools Installed and Configured!"
  only:
    - main

deploy_prod:
  stage: deploy_prod
  image: alpine/git
  script:
    - echo "Deployed to Production Successfully!"
  when: manual
  only:
    - main

