stages:
  - build
  - prepare
  - test_unit
  - test_integration
  - test_functional
  - deploy_dev
  - deploy_hml
  - deploy_prod

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .venv/
    - .cache/pip

prepare:
  stage: prepare
  image: python:3.11-slim
  script:
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
  artifacts:
    paths:
      - .venv/
    expire_in: 1 hour

build:
  stage: build
  image: docker:20.10.21
  services:
    - docker:dind
  script:
    - chmod +x scripts/build.sh
    - ./scripts/build.sh

test_unit:
  stage: test_unit
  image: python:3.11-slim
  variables:
    VENV_PATH: ".venv"
    SECRET_KEY: "test-secret-key"
    FLASK_ENV: "testing"
  needs: [prepare]
  script:
    - . .venv/bin/activate
    - pip install -r requirements.txt  # Garante que dependências estejam disponíveis
    - python todo_project/create_db.py  # Cria o banco antes dos testes
    - chmod +x scripts/test_unit.sh
    - ./scripts/test_unit.sh
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test_integration:
  stage: test_integration
  image: docker:20.10.21
  services:
    - docker:dind
  script:
    - chmod +x scripts/test_integration.sh
    - ./scripts/test_integration.sh

test_functional:
  stage: test_functional
  image: docker:20.10.21
  services:
    - docker:dind
  script:
    - chmod +x scripts/test_functional.sh
    - ./scripts/test_functional.sh

deploy_dev:
  stage: deploy_dev
  image: alpine:latest
  only:
    - develop
  script:
    - chmod +x scripts/deploy_dev.sh
    - ./scripts/deploy_dev.sh

deploy_hml:
  stage: deploy_hml
  image: alpine:latest
  only:
    - hml
  script:
    - chmod +x scripts/deploy_hml.sh
    - ./scripts/deploy_hml.sh

deploy_prod:
  stage: deploy_prod
  image: alpine:latest
  only:
    - prod
  script:
    - chmod +x scripts/deploy_prod.sh
    - ./scripts/deploy_prod.sh
